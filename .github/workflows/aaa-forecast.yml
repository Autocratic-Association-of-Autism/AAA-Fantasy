name: AAA Forecast Engine
on:
  workflow_dispatch:
    inputs:
      week:
        description: 'Optional NFL week (blank = next actionable week)'
        required: false
        type: string
  workflow_run:
    workflows: ['ESPN Fantasy Export']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'analysis/aaa_engine/**'
      - '.github/workflows/aaa-forecast.yml'

# Frequent model commits should not run many simultaneous downloads of the
# same large ESPN export artifact; keep only the latest workflow execution.
concurrency:
  group: aaa-forecast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  validate-and-forecast:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install forecast runtime
        run: python -m pip install numpy
      - name: Unit and regression tests
        env:
          PYTHONPATH: analysis
        run: python -m unittest discover -s analysis/aaa_engine/tests -v
      - name: Validate and forecast from newest league export
        env:
          PYTHONPATH: analysis
          GH_TOKEN: ${{ github.token }}
          EXPORT_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
          REQUESTED_WEEK: ${{ inputs.week || '' }}
        run: |
          if [ -n "$REQUESTED_WEEK" ]; then
            python -m aaa_engine.pipeline --week "$REQUESTED_WEEK"
          else
            python -m aaa_engine.pipeline
          fi
      - name: Regression tests against freshly downloaded ESPN data
        if: always()
        env:
          PYTHONPATH: analysis
        run: |
          if [ -f forecast_output/current_export.json ]; then
            python -m unittest discover -s analysis/aaa_engine/tests -v
          else
            echo 'No league snapshot was downloaded; cannot execute data-dependent regression tests' >&2
            exit 1
          fi
      - name: Upload reproducible validation and forecast artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AAA-Forecast-Validation-${{ github.run_id }}
          path: |
            forecast_output/validation.json
            forecast_output/forecast.json
            forecast_output/workload_forecast.json
            forecast_output/prospective_scorecard.json
            forecast_output/decision_backtest.json
            forecast_output/game_environment_backtest.json
            forecast_output/nfl_kickoffs.json
            forecast_output/blocked.json
          if-no-files-found: warn
          retention-days: 90
