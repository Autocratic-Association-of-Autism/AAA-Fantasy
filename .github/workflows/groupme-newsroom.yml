name: Update GroupMe Newsroom

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Download fantasy league GroupMe messages
        env:
          GROUPME_ACCESS_TOKEN: ${{ secrets.GROUPME_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse
          import urllib.error
          from datetime import datetime, timezone

          TOKEN = os.environ["GROUPME_ACCESS_TOKEN"]
          TARGET_GROUP = "Grab Him by the Titties Fantasy Football League"
          BASE = "https://api.groupme.com/v3"

          def api_get(path, params=None):
              url = BASE + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)

              req = urllib.request.Request(
                  url,
                  headers={
                      "X-Access-Token": TOKEN,
                      "Accept": "application/json",
                      "User-Agent": "AAA-Fantasy-Newsroom"
                  }
              )

              with urllib.request.urlopen(req) as response:
                  return json.load(response)["response"]

          # Find the fantasy league without exposing any other GroupMe chats.
          groups = []
          page = 1

          while True:
              batch = api_get(
                  "/groups",
                  {"page": page, "per_page": 100, "omit": "memberships"}
              )

              if not batch:
                  break

              groups.extend(batch)

              if len(batch) < 100:
                  break

              page += 1

          matches = [g for g in groups if g.get("name") == TARGET_GROUP]

          if not matches:
              raise SystemExit(f'Could not find GroupMe group: "{TARGET_GROUP}"')

          group = matches[0]
          group_id = group["id"]

          # Download the complete available message history.
          messages = []
          before_id = None

          while True:
              params = {"limit": 100}
              if before_id:
                  params["before_id"] = before_id

              try:
                  result = api_get(
                      f"/groups/{group_id}/messages",
                      params
                  )
              except urllib.error.HTTPError as e:
                  # GroupMe returns 304 when there are no older messages.
                  if e.code == 304:
                      break
                  raise

              batch = result.get("messages", [])

              if not batch:
                  break

              messages.extend(batch)
              before_id = batch[-1]["id"]

              if len(batch) < 100:
                  break

          # Remove duplicate IDs just in case, then put messages oldest -> newest.
          unique = {m["id"]: m for m in messages}
          messages = sorted(
              unique.values(),
              key=lambda m: (m.get("created_at", 0), m.get("id", ""))
          )

          archive = {
              "archive_type": "AAA Fantasy GroupMe Newsroom",
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "group": {
                  "id": group_id,
                  "name": group["name"]
              },
              "message_count": len(messages),
              "messages": messages
          }

          with open("groupme_newsroom.json", "w", encoding="utf-8") as f:
              json.dump(archive, f, ensure_ascii=False, indent=2)

          print(f"Created newsroom archive with {len(messages)} messages.")
          PY

      - name: Upload private newsroom file
        uses: actions/upload-artifact@v4
        with:
          name: groupme-newsroom
          path: groupme_newsroom.json
          retention-days: 7
