name: Update GroupMe Newsroom

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download only new fantasy league GroupMe messages
        env:
          GROUPME_ACCESS_TOKEN: ${{ secrets.GROUPME_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import urllib.parse
          import urllib.error
          from datetime import datetime, timezone
          from pathlib import Path

          TOKEN = os.environ["GROUPME_ACCESS_TOKEN"]
          GROUP_ID = "69334594"
          GROUP_NAME = "Grab Him by the Titties Fantasy Football League"
          BASE = "https://api.groupme.com/v3"

          # This is the newest message from the full archive uploaded on 2026-10-01.
          # It is used only if the state file has never been created.
          INITIAL_LAST_MESSAGE_ID = "179085212604923279"

          STATE_FILE = Path(".groupme-newsroom-state.json")
          OUTPUT_FILE = Path("groupme_newsroom_new.json")

          def api_get(path, params=None):
              url = BASE + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)

              for attempt in range(10):
                  req = urllib.request.Request(
                      url,
                      headers={
                          "X-Access-Token": TOKEN,
                          "Accept": "application/json",
                          "User-Agent": "AAA-Fantasy-Newsroom"
                      }
                  )

                  try:
                      with urllib.request.urlopen(req, timeout=30) as response:
                          data = json.load(response)["response"]

                      time.sleep(1.0)
                      return data

                  except urllib.error.HTTPError as e:
                      if e.code == 304:
                          return {"messages": []}

                      if e.code == 429:
                          retry_after = e.headers.get("Retry-After")
                          try:
                              wait = int(retry_after)
                          except (TypeError, ValueError):
                              wait = min(15 * (attempt + 1), 120)

                          print(
                              f"GroupMe rate limit reached. "
                              f"Waiting {wait} seconds before retry..."
                          )
                          time.sleep(wait)
                          continue

                      raise

              raise RuntimeError(
                  "GroupMe continued rate-limiting after multiple retries."
              )

          if STATE_FILE.exists():
              state = json.loads(STATE_FILE.read_text(encoding="utf-8"))
              last_message_id = state.get(
                  "last_message_id",
                  INITIAL_LAST_MESSAGE_ID
              )
              print(f"Loaded checkpoint: {last_message_id}")
          else:
              last_message_id = INITIAL_LAST_MESSAGE_ID
              print(
                  "No checkpoint file yet. "
                  f"Starting after seeded message: {last_message_id}"
              )

          messages = []
          after_id = last_message_id
          page_number = 0

          while True:
              result = api_get(
                  f"/groups/{GROUP_ID}/messages",
                  {
                      "limit": 100,
                      "after_id": after_id
                  }
              )

              batch = result.get("messages", [])

              if not batch:
                  break

              messages.extend(batch)
              after_id = batch[-1]["id"]
              page_number += 1

              print(
                  f"Downloaded {len(messages)} new messages "
                  f"({page_number} batches)."
              )

              if len(batch) < 100:
                  break

          unique = {
              message["id"]: message
              for message in messages
          }

          messages = sorted(
              unique.values(),
              key=lambda m: (
                  m.get("created_at", 0),
                  m.get("id", "")
              )
          )

          archive = {
              "archive_type": "AAA Fantasy GroupMe Newsroom Incremental",
              "generated_at_utc": datetime.now(
                  timezone.utc
              ).isoformat(),
              "group": {
                  "id": GROUP_ID,
                  "name": GROUP_NAME
              },
              "previous_checkpoint_message_id": last_message_id,
              "message_count": len(messages),
              "messages": messages
          }

          OUTPUT_FILE.write_text(
              json.dumps(
                  archive,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          if messages:
              newest = messages[-1]
              state = {
                  "group_id": GROUP_ID,
                  "group_name": GROUP_NAME,
                  "last_message_id": newest["id"],
                  "last_message_created_at": newest.get("created_at"),
                  "updated_at_utc": datetime.now(
                      timezone.utc
                  ).isoformat()
              }

              STATE_FILE.write_text(
                  json.dumps(state, indent=2),
                  encoding="utf-8"
              )

              print(
                  f"Checkpoint advanced to {newest['id']}."
              )
          else:
              print("No new messages. Checkpoint unchanged.")

          print("")
          print(
              f"SUCCESS: Created incremental newsroom export "
              f"with {len(messages)} new messages."
          )
          PY

      - name: Save GroupMe checkpoint
        run: |
          if git diff --quiet -- .groupme-newsroom-state.json && \
             git diff --cached --quiet -- .groupme-newsroom-state.json; then
            echo "Checkpoint did not change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .groupme-newsroom-state.json
          git commit -m "Update GroupMe newsroom checkpoint"
          git push

      - name: Upload new GroupMe messages
        uses: actions/upload-artifact@v4
        with:
          name: groupme-newsroom-new
          path: groupme_newsroom_new.json
          retention-days: 7
