name: ESPN Fantasy Export

on:
  workflow_dispatch:
  schedule:
    # Twice daily: morning and evening league refresh.
    - cron: '17 7,19 * * *'
      timezone: 'America/New_York'
    # Wednesday post-waiver refresh.
    - cron: '37 4 * * 3'
      timezone: 'America/New_York'
    # Sunday pre-kickoff refresh.
    - cron: '41 11 * * 0'
      timezone: 'America/New_York'
  push:
    branches: [main]
    paths:
      - 'espn_github_export.py'
      - '.github/workflows/espn-export.yml'

# Prevent manual and scheduled runs from racing each other.
concurrency:
  group: aaa-espn-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install espn-api pandas openpyxl

      - name: Export ESPN league data
        env:
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: python espn_github_export.py

      - name: Upload ESPN export
        uses: actions/upload-artifact@v4
        with:
          name: ESPN-League-1438350867-2026
          path: export/
          retention-days: 30
